services:
  - type: web
    name: epoxy-crm
    runtime: node
    plan: free            # free tier: data resets on every redeploy/restart/spin-down
    buildCommand: "true"  # no dependencies to install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATA_DIR
        value: /tmp/epoxy-data   # change to disk mount (e.g. /var/data) on Starter + disk
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
